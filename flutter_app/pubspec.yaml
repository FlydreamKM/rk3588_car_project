name: smart_car_app
description: "智能小车多模态交互控制终端 - RK3588S 小车 APP"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # 视频流播放（MJPEG）
  mjpeg_stream: ^1.0.1
  
  # 仪表盘UI
  syncfusion_flutter_gauges: ^28.1.33
  
  # 图表
  fl_chart: ^0.70.0
  
  # HTTP请求
  dio: ^5.8.0
  http: ^1.3.0
  
  # WebSocket + SSE
  web_socket_channel: ^3.0.2
  
  # 摇杆控制
  flutter_joystick: ^0.2.2
  
  # 语音识别（手机端）
  speech_to_text: ^7.0.0
  
  # 语音合成
  flutter_tts: ^4.2.2
  
  # 状态管理
  provider: ^6.1.4
  
  # 动画
  flutter_animate: ^4.5.2
  
  # 炫酷UI
  glassmorphism_ui: ^0.3.0
  sleek_circular_slider: ^2.0.0
  lottie: ^3.3.0
  
  # 权限管理
  permission_handler: ^11.3.0
  
  # 本地存储
  shared_preferences: ^2.3.0
  
  # SSH终端连接
  dartssh2: ^2.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/lottie/

