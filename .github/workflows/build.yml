name: Build Flutter APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Generate missing Android resources
        working-directory: ./flutter_app/android/app/src/main
        run: |
          # Create res directories
          mkdir -p res/values
          mkdir -p res/drawable
          mkdir -p res/mipmap-mdpi
          mkdir -p res/mipmap-hdpi
          mkdir -p res/mipmap-xhdpi
          mkdir -p res/mipmap-xxhdpi
          mkdir -p res/mipmap-xxxhdpi

          # Generate colors.xml
          cat > res/values/colors.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="flutter_blue">#0175C2</color>
              <color name="flutter_white">#FFFFFF</color>
          </resources>
          XML

          # Generate styles.xml with LaunchTheme and NormalTheme
          cat > res/values/styles.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">@drawable/launch_background</item>
                  <item name="android:windowFullscreen">true</item>
              </style>
              <style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">?android:colorBackground</item>
              </style>
          </resources>
          XML

          # Generate launch_background.xml
          cat > res/drawable/launch_background.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@android:color/white" />
          </layer-list>
          XML

          # Generate default launcher icons using ImageMagick
          convert -size 48x48 xc:"#009688" -pointsize 20 -fill white -gravity center -annotate +0+0 "S" res/mipmap-mdpi/ic_launcher.png
          convert -size 72x72 xc:"#009688" -pointsize 30 -fill white -gravity center -annotate +0+0 "S" res/mipmap-hdpi/ic_launcher.png
          convert -size 96x96 xc:"#009688" -pointsize 40 -fill white -gravity center -annotate +0+0 "S" res/mipmap-xhdpi/ic_launcher.png
          convert -size 144x144 xc:"#009688" -pointsize 60 -fill white -gravity center -annotate +0+0 "S" res/mipmap-xxhdpi/ic_launcher.png
          convert -size 192x192 xc:"#009688" -pointsize 80 -fill white -gravity center -annotate +0+0 "S" res/mipmap-xxxhdpi/ic_launcher.png

          echo "Android resources generated successfully"

      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Get dependencies
        working-directory: ./flutter_app
        run: flutter pub get

      - name: Analyze code
        working-directory: ./flutter_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build APK
        working-directory: ./flutter_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-car-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload to Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          body: |
            Smart Car Flutter APP APK
            - Built from ${{ github.sha }}
            - Download and install on Android device
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
